name: Deploy slides

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'slides/**'
      - '.github/workflows/slides.yml'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # About three times a usual run. The steps match the pre-push job of
    # ci.yml, which took under 2 minutes on cold caches.
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6

      # The deck builds with the nodejs of the devshell in flake.nix, the
      # same node that the slidev-build hook and CI use.
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Nix cache
        uses: DeterminateSystems/flakehub-cache-action@v3.21.5

      - name: Install dependencies
        run: nix develop --command npm ci --prefix slides --no-audit --no-fund

      - name: Build
        run: |
          nix develop --command node --version
          nix develop --command npm --prefix slides run build -- --base /${{ github.event.repository.name }}/

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: slides/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
