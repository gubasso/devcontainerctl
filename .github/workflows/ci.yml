name: CI

# CI runs the two stages of the git hooks in the devshell of flake.nix, so a
# push that passed the local hooks passes CI, with the same tools. A check
# that only CI can run gets its own step, with a comment that says why. See
# "CI and the git hooks" in README.md.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    # About three times a usual run: each job took under 2 minutes on cold
    # caches. A hung test then fails the job instead of holding the runner
    # for hours.
    timeout-minutes: 6
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Nix cache
        uses: DeterminateSystems/flakehub-cache-action@v3.21.5

      # The environments that pre-commit builds for the hooks that declare a
      # language. A Python environment holds the store path of the devshell
      # python, so the key follows flake.lock too.
      - name: pre-commit cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml', 'flake.lock') }}

      - name: Run the pre-commit stage
        run: nix develop --command pre-commit run --all-files --show-diff-on-failure

  pre-push:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Nix cache
        uses: DeterminateSystems/flakehub-cache-action@v3.21.5

      - name: pre-commit cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml', 'flake.lock') }}

      # The slidev-build hook needs slides/node_modules, as a local clone does.
      - name: Install the slides dependencies
        run: nix develop --command npm ci --prefix slides --no-audit --no-fund

      - name: Run the pre-push stage
        run: nix develop --command pre-commit run --all-files --hook-stage pre-push
