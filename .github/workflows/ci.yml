name: CI

# CI runs the two stages of the git hooks in the devshell of flake.nix, so a
# push that passed the local hooks passes CI, with the same tools. A check
# that only CI can run gets its own step, with a comment that says why. See
# "CI and the git hooks" in README.md.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    # About three times a usual run: each job took under 2 minutes on cold
    # caches. A hung test then fails the job instead of holding the runner
    # for hours.
    timeout-minutes: 6
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Nix cache
        uses: DeterminateSystems/flakehub-cache-action@v3.21.5

      # The hook runner is a host tool, so the job installs it outside the
      # devshell, at the version the hosts run, and `nix develop` keeps it
      # on PATH. The action is pinned by commit SHA
      # (https://prek.j178.dev/ci/). The cache step below owns the cache.
      - name: Install prek
        uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0
        with:
          install-only: true
          prek-version: 0.5.7
          cache: false

      # The environments that prek builds for the hooks that declare a
      # language, in its default home ~/.cache/prek. A hook environment can
      # hold a store path of the devshell, so the key follows flake.lock too.
      - name: prek cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/prek
          key: prek-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml', 'flake.lock') }}

      - name: Run the pre-commit stage
        run: nix develop --command prek run --all-files --show-diff-on-failure

  pre-push:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Nix cache
        uses: DeterminateSystems/flakehub-cache-action@v3.21.5

      - name: Install prek
        uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0
        with:
          install-only: true
          prek-version: 0.5.7
          cache: false

      - name: prek cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/prek
          key: prek-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml', 'flake.lock') }}

      # The slidev-build hook needs slides/node_modules, as a local clone does.
      - name: Install the slides dependencies
        run: nix develop --command npm ci --prefix slides --no-audit --no-fund

      - name: Run the pre-push stage
        run: nix develop --command prek run --all-files --hook-stage pre-push
