# The host supplies the hook runner prek, and this is the oldest prek the
# configuration accepts
# (https://prek.j178.dev/reference/configuration/#minimum_prek_version).
minimum_prek_version: "0.5.7"
default_install_hook_types: [pre-commit, commit-msg, pre-push]
# A hook runs at pre-commit unless it names its stage. The pre-push stage
# runs only the costly checks, because a pushed commit already passed the
# pre-commit stage. CI runs both stages; see "CI and the git hooks" in
# README.md. The hooks below that set `stages: [pre-commit]` need it,
# because their upstream manifests also list pre-push.
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # The two fixers skip the lock files that nix and npm write. A generated
      # file follows its generator, so no hook rewrites it: the dev environment
      # rule of nix-secrets, home/apps/claude-session/rules/dev-environment.md.
      # The reading hooks, such as check-json5 and gitleaks, keep them.
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: ^flake\.lock$|(?:^|/)package-lock\.json$
        stages: [pre-commit]
      - id: end-of-file-fixer
        exclude: ^flake\.lock$|(?:^|/)package-lock\.json$
        stages: [pre-commit]
      # pretty-format-json omitted intentionally: the only plain .json file (devcontainers/agents/seccomp-bwrap.json) is hand-written and reads better with the structure it has; check-json5 already validates syntax
      - id: check-added-large-files
        args: ["--maxkb=2048"]
        stages: [pre-commit]
      - id: detect-private-key
      - id: check-executables-have-shebangs
        stages: [pre-commit]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-shebang-scripts-are-executable
        stages: [pre-commit]
      - id: no-commit-to-branch
        # master is this repository's trunk and the branch you work on, so it
        # is not in the ban list. staging and main are kept as guards against a
        # commit landing on a branch this project does not use.
        args: [--branch, staging, --branch, main]

  - repo: https://github.com/maresb/check-json5
    rev: v1.0.1
    hooks:
      - id: check-json5

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.12.0-2
    hooks:
      - id: shfmt
        args: ["-w", "-i", "2", "-ci", "-bn", "-s"]
        files: '\.(sh|bash|bats)$|^bin/dctl$|^hooks/post-stow$'
        stages: [pre-commit]

  # shellharden – auto-quote variables and command substitutions
  - repo: local
    hooks:
      # owner: devshell (no-hook-language) shellharden publishes no pre-commit hook.
      - id: shellharden
        name: shellharden
        language: system
        entry: shellharden --replace
        types: [shell]

  - repo: https://github.com/openstack/bashate
    rev: 2.1.1
    hooks:
      - id: bashate
        args: ["-i", "E003,E006", "-e", "E005"]
        exclude: ^tests/(.*\.bats|test_helper\.bash)$

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
        pass_filenames: false
        stages: [pre-commit]

  - repo: https://github.com/jorisroovers/gitlint
    rev: v0.19.1
    hooks:
      - id: gitlint
        stages: [commit-msg]
        types_or: [text]

  # commitizen builds from its upstream hook. It ran from the devShell when its
  # hook needed /lib64/ld-linux-x86-64.so.2; the host supplies that loader.
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.19.3
    hooks:
      - id: commitizen
        stages: [commit-msg]

  # Slides sub-project (Slidev) ----------------------------------------------
  # Prettier formats Markdown, Vue, TS, JSON inside slides/ only.
  - repo: local
    hooks:
      # owner: devshell (no-hook-language) prettier publishes no pre-commit hook, and pre-commit/mirrors-prettier is archived since 2024-04.
      - id: prettier
        name: prettier
        language: system
        entry: prettier --write --ignore-unknown
        types: [text]
        files: ^slides/.*\.(md|vue|ts|js|json|ya?ml|css)$
        # slides/slides.md and slides/pages/*.md use Slidev's per-slide
        # frontmatter syntax (`---\nlayout: foo\n---`), which prettier
        # mangles into setext H2 headings and breaks the deck. Keep them
        # out — see slides/.prettierignore for the same rule honored by
        # any direct `npx prettier` invocation.
        exclude: |
          (?x)^slides/(
            node_modules|
            dist|
            \.slidev|
            package-lock\.json|
            slides\.md|
            pages/.*\.md
          )

  # Safety gates of docs/compliance/SPEC.md, section 12. Each hook calls its
  # Makefile target, so a gate has one definition. gate-no-raw-ansi and
  # gate-one-public-fn-per-file stay deferred until DCTL_ENFORCE_ANSI_GATE or
  # DCTL_ENFORCE_ONEFN_GATE is set. make comes from stdenv in the devShell.
  - repo: local
    hooks:
      # owner: devshell (no-hook-language) the gate is a make target, and make has no hook in a language that the hook runner builds.
      - id: gate-no-eval
        name: gate no eval
        language: system
        entry: make --no-print-directory gate-no-eval
        files: ^(bin|lib|hooks)/.*\.sh$
        pass_filenames: false
      # owner: devshell (no-hook-language) the gate is a make target, and make has no hook in a language that the hook runner builds.
      - id: gate-no-raw-ansi
        name: gate no raw ansi
        language: system
        entry: make --no-print-directory gate-no-raw-ansi
        files: ^(bin|lib)/.*\.sh$
        pass_filenames: false
      # owner: devshell (no-hook-language) the gate is a make target, and make has no hook in a language that the hook runner builds.
      - id: gate-one-public-fn-per-file
        name: gate one public fn per file
        language: system
        entry: make --no-print-directory gate-one-public-fn-per-file
        files: ^lib/.*\.sh$
        pass_filenames: false

  - repo: meta
    hooks:
      - id: check-hooks-apply
      - id: check-useless-excludes

  - repo: local
    hooks:
      # owner: devshell (no-hook-language) bats has no hook in a language that the hook runner builds.
      - id: bats-unit
        name: bats unit tests
        language: system
        # The suite takes about 2.5 minutes. `timeout` fails the commit if a
        # test hangs, instead of blocking it. BATS_TEST_TIMEOUT is not used:
        # bats 1.12 does not kill a process tree deeper than one level, and
        # bats 1.13 and 1.14 hold the run for the whole limit after every
        # failing test (bats-core#1206).
        entry: timeout 600 bats --filter-tags 'unit,!integration' tests
        pass_filenames: false
        always_run: true
        # Without a stage list the hook runs at every installed hook type, so
        # one commit ran the unit suite twice: at pre-commit and at commit-msg.
        stages: [pre-commit]
      # owner: devshell (no-hook-language) bats has no hook in a language that the hook runner builds.
      - id: bats-integration
        name: bats integration tests
        language: system
        entry: bats --filter-tags integration tests
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      # slidev build – catches deck breakages before pushing to GitHub Pages.
      # Requires slides/node_modules (run `npm ci` in slides/ first). node comes
      # from the devShell.
      # owner: devshell (no-hook-language) the Slidev build runs the npm of the devshell on slides/package.json, and has no hook in a language that the hook runner builds.
      - id: slidev-build
        name: slidev build
        language: system
        entry: bash -c 'cd slides && npm run build'
        files: ^slides/
        pass_filenames: false
        stages: [pre-push]

  - repo: local
    hooks:
      - id: no-language-library-in-flake
        name: a flake holds no language library
        language: pygrep
        entry: '^(?!\s*#).*(withPackages|python3[0-9]*Packages\.|pythonPackages\.|nodePackages\.|perlPackages\.)'
        files: '(^|/)flake\.nix$|(^|/)nix/.*\.nix$'

  # The hooks that exobrain-tech publishes. A flake reference reads the git
  # tree of a checkout, never a path copy of the whole folder into the Nix
  # store. A flake holds no git hook runner, because the host supplies prek.
  # host-requirements.toml parses each time it changes; the hook runs the
  # exobrain of the devshell.
  - repo: https://github.com/gubasso/exobrain-tech
    rev: v1.1.0
    hooks:
      - id: no-path-flake-reference
      - id: no-hook-runner-in-flake
      - id: host-requirements
